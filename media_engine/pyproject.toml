[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony360-media-engine"
version = "0.1.0"
description = "Harmony360-native governed media pipeline for YouTube video production"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["harmony360_media*"]
