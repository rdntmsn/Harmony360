[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony360"
version = "0.2.0"
description = "Harmony360 governed knowledge runtime foundation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Harmony360"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
harmony360 = "harmony360.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
