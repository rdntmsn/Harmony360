[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony360-orchestration"
version = "0.1.0a1"
description = "Official CrewAI change monitoring and a governed Harmony360 orchestration boundary"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["packaging>=24,<27"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
h360 = "harmony360_orchestration.cli:main"

[project.urls]
Repository = "https://github.com/rdntmsn/Harmony360"

[tool.setuptools.packages.find]
where = ["src"]

