name: Python package

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'reconciliation/core_runtime_v1/**'
      - '.github/workflows/python.yml'
  push:
    branches: [main, 'codex/python-orchestration-*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'reconciliation/core_runtime_v1/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install packages and validation tools
        run: python -m pip install -e reconciliation/core_runtime_v1 -e . pytest build
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test the orchestration package
        run: python -m unittest discover -s tests -v
      - name: Test the retained core
        run: python -m pytest reconciliation/core_runtime_v1/tests -q
      - name: Exercise the native core and serialization
        run: h360 core-demo --output runtime-output/ci-core.har360
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python }}-distributions
          path: dist/*

