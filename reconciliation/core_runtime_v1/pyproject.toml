[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony360-runtime-spine"
version = "1.1.0"
description = "Canonical Harmony360 runtime spine reconciliation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "cryptography>=42"
]

[tool.setuptools]
packages = ["harmony360", "harmony360.security"]
